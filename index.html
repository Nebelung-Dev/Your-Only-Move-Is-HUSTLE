<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Your Only Move Is HUSTLE</title>
	<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b1120'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='sans-serif' font-weight='bold' font-size='34' fill='%23f8fafc'%3EY%3C/text%3E%3C/svg%3E">
	<link rel="preload" as="script" href="godot.js">
	<style>
		:root {
			color-scheme: dark;
			--bg: #000000;
			--fg: #f1f5f9;
			--muted: #94a3b8;
			--track: #1e293b;
			--fill: #f8fafc;
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			background-color: var(--bg);
			color: var(--fg);
			font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			overflow: hidden;
		}

		main {
			position: relative;
			width: 100dvw;
			height: 100dvh;
			display: grid;
			place-items: center;
			background-color: var(--bg);
		}

		#canvas {
			display: block;
			width: 100%;
			height: 100%;
			margin: 0;
			outline: none;
			touch-action: none;
		}

		#obsidian-splash {
			position: fixed;
			inset: 0;
			z-index: 20;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 1.5rem;
			padding: 2rem;
			background-color: var(--bg);
			opacity: 1;
			transition: opacity 0.45s ease;
		}

		#obsidian-splash.is-hidden {
			opacity: 0;
			pointer-events: none;
		}

		.logo-frame {
			width: min(72dvw, 560px);
			aspect-ratio: 1565 / 743;
			display: flex;
			align-items: center;
			justify-content: center;
			animation: logo-enter 0.6s ease-out both;
		}

		.logo-frame img {
			width: 100%;
			height: 100%;
			object-fit: contain;
			display: block;
		}

		.boot-status {
			width: min(60dvw, 320px);
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 0.55rem;
		}

		progress#boot-progress {
			width: 100%;
			height: 6px;
			appearance: none;
			border: none;
			border-radius: 999px;
			background-color: var(--track);
			overflow: hidden;
		}

		progress#boot-progress::-webkit-progress-bar {
			background-color: var(--track);
			border-radius: 999px;
		}

		progress#boot-progress::-webkit-progress-value {
			background-color: var(--fill);
			border-radius: 999px;
			transition: width 0.15s ease;
		}

		progress#boot-progress::-moz-progress-bar {
			background-color: var(--fill);
			border-radius: 999px;
		}

		#boot-message {
			margin: 0;
			font-size: clamp(0.8rem, 0.7rem + 0.35vw, 0.95rem);
			color: var(--muted);
			letter-spacing: 0.04em;
			text-align: center;
		}

		#boot-error {
			margin: 0;
			max-width: 52ch;
			color: #fca5a5;
			font-size: 0.9rem;
			text-align: center;
			line-height: 1.4;
			display: none;
		}

		@keyframes logo-enter {
			from {
				opacity: 0;
				transform: scale(0.97);
			}
			to {
				opacity: 1;
				transform: scale(1);
			}
		}

		@media (prefers-reduced-motion: reduce) {
			#obsidian-splash,
			.logo-frame {
				animation: none;
				transition: none;
			}
		}

		.mod-trigger {
			position: fixed;
			top: 0.75rem;
			right: 0.75rem;
			z-index: 15;
			padding: 0.45rem 0.75rem;
			min-height: 36px;
			font: inherit;
			font-size: 0.85rem;
			font-weight: 600;
			color: var(--fg);
			background-color: rgba(15, 23, 42, 0.78);
			border: 1px solid rgba(148, 163, 184, 0.35);
			border-radius: 0.45rem;
			cursor: pointer;
			backdrop-filter: blur(4px);
		}

		.mod-trigger:hover {
			background-color: rgba(30, 41, 59, 0.92);
			border-color: rgba(248, 250, 252, 0.65);
		}

		.mod-trigger:focus-visible,
		#mod-manager-dialog button:focus-visible,
		#mod-manager-dialog input:focus-visible {
			outline: 2px solid #93c5fd;
			outline-offset: 2px;
		}

		#mod-manager-dialog {
			width: min(92vw, 480px);
			max-height: 85dvh;
			padding: 1.25rem 1.35rem;
			color: var(--fg);
			background-color: #0b1120;
			border: 1px solid #334155;
			border-radius: 0.75rem;
			box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
		}

		#mod-manager-dialog[open] {
			display: flex;
			flex-direction: column;
			gap: 1rem;
		}

		dialog:modal {
			overscroll-behavior: contain;
		}

		dialog::backdrop {
			background-color: rgba(0, 0, 0, 0.68);
			backdrop-filter: blur(3px);
			overflow: hidden;
			overscroll-behavior: contain;
		}

		.mod-dialog-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 0.75rem;
		}

		.mod-dialog-header h1 {
			margin: 0;
			font-size: 1.15rem;
			font-weight: 700;
		}

		#mod-upload-form {
			display: flex;
			flex-direction: column;
			gap: 0.85rem;
		}

		.mod-field {
			display: flex;
			flex-direction: column;
			align-items: flex-start;
			gap: 0.3rem;
		}

		.mod-field label {
			font-size: 0.95rem;
			font-weight: 600;
		}

		.mod-field input[type="file"] {
			width: 100%;
			min-height: 44px;
			padding: 0.55rem;
			font: inherit;
			font-size: max(1rem, 0.95rem);
			color: var(--fg);
			background-color: #111827;
			border: 1px solid #475569;
			border-radius: 0.45rem;
			cursor: pointer;
		}

		.mod-hint {
			margin: 0;
			font-size: 0.82rem;
			line-height: 1.4;
			color: var(--muted);
		}

		.mod-list {
			list-style: none;
			margin: 0;
			padding: 0;
			display: flex;
			flex-direction: column;
			gap: 0.45rem;
			max-height: 180px;
			overflow-y: auto;
		}

		.mod-list-empty {
			padding: 0.65rem 0.75rem;
			font-size: 0.85rem;
			color: var(--muted);
			background-color: rgba(15, 23, 42, 0.7);
			border: 1px dashed #334155;
			border-radius: 0.45rem;
		}

		.mod-list-item {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 0.6rem;
			padding: 0.5rem 0.7rem;
			background-color: #111827;
			border: 1px solid #334155;
			border-radius: 0.45rem;
			font-size: 0.88rem;
		}

		.mod-list-meta {
			display: flex;
			flex-direction: column;
			min-width: 0;
		}

		.mod-list-name {
			font-weight: 600;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.mod-list-size {
			font-size: 0.76rem;
			color: var(--muted);
		}

		.mod-btn {
			min-height: 40px;
			padding: 0.45rem 0.9rem;
			font: inherit;
			font-size: 0.9rem;
			font-weight: 600;
			color: var(--fg);
			background-color: #1e293b;
			border: 1px solid #475569;
			border-radius: 0.45rem;
			cursor: pointer;
		}

		.mod-btn:hover {
			background-color: #334155;
		}

		.mod-btn-primary {
			color: #020617;
			background-color: #f8fafc;
			border-color: #f8fafc;
		}

		.mod-btn-primary:hover {
			background-color: #e2e8f0;
		}

		.mod-btn-danger {
			min-height: 34px;
			padding: 0.3rem 0.65rem;
			font-size: 0.8rem;
			color: #fecaca;
			background-color: rgba(127, 29, 29, 0.45);
			border-color: rgba(248, 113, 113, 0.45);
		}

		.mod-btn-danger:hover {
			background-color: rgba(153, 27, 27, 0.75);
		}

		.mod-actions {
			display: flex;
			align-items: center;
			justify-content: flex-end;
			gap: 0.6rem;
			flex-wrap: wrap;
		}

		#mod-status {
			margin: 0;
			min-height: 1.25em;
			font-size: 0.85rem;
			color: #cbd5e1;
		}
	</style>
</head>

			const modStatusEl = document.getElementById("mod-status");
			const modClearBtn = document.getElementById("mod-clear-btn");

			canvas.addEventListener("contextmenu", (event) => {
				event.preventDefault();
			});

			function openModsDB() {
				return new Promise((resolve, reject) => {
					if (!("indexedDB" in window)) {
						reject(new Error("IndexedDB is unavailable in this browser."));
						return;
					}
					const req = window.indexedDB.open(MOD_DB_NAME, 1);
					req.onupgradeneeded = () => {
						const db = req.result;
						if (!db.objectStoreNames.contains(MOD_STORE_NAME)) {
							db.createObjectStore(MOD_STORE_NAME, { keyPath: "name" });
						}
					};
					req.onsuccess = () => resolve(req.result);
					req.onerror = () => reject(req.error || new Error("Failed to open mods database."));
				});
			}

			async function getAllMods() {
				try {
					const db = await openModsDB();
					return await new Promise((resolve, reject) => {
						const tx = db.transaction(MOD_STORE_NAME, "readonly");
						const req = tx.objectStore(MOD_STORE_NAME).getAll();
						req.onsuccess = () => resolve(req.result || []);
						req.onerror = () => reject(req.error);
					});
				} catch (err) {
					console.warn("Unable to read stored mods:", err);
					return [];
				}
			}

			async function saveModRecord(name, buffer) {
				const db = await openModsDB();
				return new Promise((resolve, reject) => {
					const tx = db.transaction(MOD_STORE_NAME, "readwrite");
					tx.objectStore(MOD_STORE_NAME).put({
						name,
						size: buffer.byteLength,
						buffer
					});
					tx.oncomplete = () => resolve();
					tx.onerror = () => reject(tx.error);
				});
			}

			async function deleteModRecord(name) {
				const db = await openModsDB();
				return new Promise((resolve, reject) => {
					const tx = db.transaction(MOD_STORE_NAME, "readwrite");
					tx.objectStore(MOD_STORE_NAME).delete(name);
					tx.oncomplete = () => resolve();
					tx.onerror = () => reject(tx.error);
				});
			}

			async function clearModRecords() {
				const db = await openModsDB();
				return new Promise((resolve, reject) => {
					const tx = db.transaction(MOD_STORE_NAME, "readwrite");
					tx.objectStore(MOD_STORE_NAME).clear();
					tx.oncomplete = () => resolve();
					tx.onerror = () => reject(tx.error);
				});
			}

			function formatBytes(bytes) {
				if (bytes < 1024) return `${bytes} B`;
				if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
				return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
			}

			async function renderModList() {
				const mods = await getAllMods();
				modTrigger.textContent = mods.length > 0 ? `Mods (${mods.length})` : "Mods (.zip)";
				modListEl.innerHTML = "";
				if (mods.length === 0) {
					const emptyLi = document.createElement("li");
					emptyLi.className = "mod-list-empty";
					emptyLi.textContent = "No zip mods installed yet.";
					modListEl.appendChild(emptyLi);
					return;
				}
				for (const mod of mods) {
					const li = document.createElement("li");
					li.className = "mod-list-item";

					const meta = document.createElement("div");
					meta.className = "mod-list-meta";

					const nameSpan = document.createElement("span");
					nameSpan.className = "mod-list-name";
					nameSpan.textContent = mod.name;

					const sizeSpan = document.createElement("span");
					sizeSpan.className = "mod-list-size";
					sizeSpan.textContent = formatBytes(mod.size);

					meta.append(nameSpan, sizeSpan);

					const removeBtn = document.createElement("button");
					removeBtn.type = "button";
					removeBtn.className = "mod-btn mod-btn-danger";
					removeBtn.textContent = "Remove";
					removeBtn.setAttribute("aria-label", `Remove ${mod.name}`);
					removeBtn.addEventListener("click", async () => {
						await deleteModRecord(mod.name);
						modStatusEl.textContent = `Removed ${mod.name}. Click Apply & Reload to update the game.`;
						await renderModList();
					});

					li.append(meta, removeBtn);
					modListEl.appendChild(li);
				}
			}

			function openModManager() {
				renderModList();
				if (!modDialog.open) {
					modDialog.showModal();
				}
			}

			window.yomihOpenModManager = openModManager;

			modTrigger.addEventListener("click", openModManager);

			modDialog.addEventListener("close", () => {
				modDialog.returnValue = "";
				canvas.focus();
			});

			if (!("closedBy" in HTMLDialogElement.prototype)) {
				const isOutsideDialog = (event) => {
					const r = modDialog.getBoundingClientRect();
					return (
						event.clientX < r.left ||
						event.clientX > r.right ||
						event.clientY < r.top ||
						event.clientY > r.bottom
					);
				};
				let pressedOutside = false;
				modDialog.addEventListener("pointerdown", (event) => {
					pressedOutside = isOutsideDialog(event);
				});
				modDialog.addEventListener("pointerup", (event) => {
					if (pressedOutside && isOutsideDialog(event)) {
						modDialog.close();
					}
					pressedOutside = false;
				});
			}

			modFileInput.addEventListener("change", async () => {
				const files = Array.from(modFileInput.files || []);
				if (files.length === 0) return;
				let added = 0;
				for (const file of files) {
					if (!file.name.toLowerCase().endsWith(".zip")) {
						modStatusEl.textContent = `Skipped ${file.name}: only .zip archives are supported.`;
						continue;
					}
					const buf = await file.arrayBuffer();
					const safeName = file.name.replace(/[/\\]/g, "_");
					await saveModRecord(safeName, buf);
					added += 1;
				}
				modFileInput.value = "";
				await renderModList();
				if (added > 0) {
					try {
						window.localStorage.setItem("yomih_enable_mods_on_boot", "1");
					} catch (_) {}
					modStatusEl.textContent = `Saved ${added} mod zip${added === 1 ? "" : "s"}. Click Apply & Reload to load mods.`;
				}
			});

			modClearBtn.addEventListener("click", async () => {
				await clearModRecords();
				try {
					window.localStorage.removeItem("yomih_enable_mods_on_boot");
				} catch (_) {}
				await renderModList();
				modStatusEl.textContent = "Cleared all stored zip mods. Click Apply & Reload to restart vanilla.";
			});

			modForm.addEventListener("submit", async (event) => {
				event.preventDefault();
				const mods = await getAllMods();
				try {
					if (mods.length > 0) {
						window.localStorage.setItem("yomih_enable_mods_on_boot", "1");
					} else {
						window.localStorage.removeItem("yomih_enable_mods_on_boot");
					}
				} catch (_) {}
				window.location.reload();
			});

			renderModList();

			function showError(err) {
				const msg = err && err.message ? err.message : String(err);
				console.error(msg);
				progressEl.style.display = "none";
				messageEl.style.display = "none";
				errorEl.textContent = msg;
				errorEl.style.display = "block";
			}

			function hashStr(str, seed) {
				let h = seed >>> 0;
				for (let i = 0; i < str.length; i++) {
					h ^= str.charCodeAt(i);
					h = Math.imul(h, 16777619) >>> 0;
				}
				return h;
			}

			function verifyEmbeddedLogo() {
				const img = document.getElementById("obsidian-logo");
				if (!img) return false;
				const src = img.getAttribute("src") || "";
				if (!src.startsWith("data:image/png;base64,")) return false;
				let rev = "";
				for (let i = src.length - 1; i >= 0; i--) rev += src[i];
				return (
					src.length === 45334 &&
					hashStr(src, 2166136261) === 398159928 &&
					hashStr(rev, 3735928559) === 527519164
				);
			}

			if (!verifyEmbeddedLogo()) {
				showError("Embedded branding verification failed.");
				return;
			}

			if (!Engine.isWebGLAvailable()) {
				showError("WebGL is required to run Your Only Move Is HUSTLE.");
				return;
			}

			const splashStart = performance.now();
			const engine = new Engine(GODOT_CONFIG);
			engine.config.update({
				onProgress(current, total) {
					if (total > 0) {
						const pct = Math.min(100, Math.round((current / total) * 100));
						progressEl.value = pct;
						messageEl.textContent = `Loading Your Only Move Is HUSTLE... ${pct}%`;
					} else {
						progressEl.removeAttribute("value");
					}
				}
			});

			const exe = engine.config.executable;
			const pack = engine.config.mainPack || `${exe}.pck`;
			engine.config.args = ["--main-pack", pack].concat(engine.config.args);

			Promise.all([
				engine.init(exe),
				engine.preloadFile(pack, pack),
				getAllMods()
			]).then(([, , mods]) => {
				let shouldEnableMods = false;
				try {
					shouldEnableMods = window.localStorage.getItem("yomih_enable_mods_on_boot") === "1";
					window.localStorage.removeItem("yomih_enable_mods_on_boot");
				} catch (_) {}
				const activeModNames = [];
				for (const mod of mods) {
					if (mod && mod.name && mod.buffer) {
						const safeName = String(mod.name).replace(/[/\\]/g, "_");
						activeModNames.push(safeName);
						engine.copyToFS(`/userfs/mods/${safeName}`, mod.buffer);
					}
				}
				const manifestBytes = new TextEncoder().encode(JSON.stringify(activeModNames));
				engine.copyToFS("/userfs/mods_manifest.json", manifestBytes);
				if (shouldEnableMods && mods.length > 0) {
					const moddedBytes = new TextEncoder().encode('{\n  "modsEnabled": true\n}\n');
					engine.copyToFS("/userfs/modded.json", moddedBytes);
				}
				return engine.start();
			}).then(() => {
				progressEl.value = 100;
				messageEl.textContent = "Starting...";
				const elapsed = performance.now() - splashStart;
				const remaining = Math.max(0, SPLASH_MIN_MS - elapsed);

				window.setTimeout(() => {
					splash.classList.add("is-hidden");
					canvas.focus();
					window.setTimeout(() => {
						splash.remove();
					}, 500);
				}, remaining);
			}, showError);
		})();
	</script>
</body>
</html>
